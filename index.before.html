<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Remote Insight OS</title>
<meta name="description" content="Remote Insight OS — secure entrance for admins, VAs, and clients." />
<meta name="robots" content="index, follow" />
<meta name="theme-color" content="#1B1714" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
<style>
  /* ── RIOS brand tokens (warm-dark, committed single look) ─────────────── */
  :root{
    --bg:#1B1714;            /* warm near-black */
    --bg-2:#161210;          /* deeper vignette */
    --surface:#262019;       /* raised card */
    --surface-2:#322A22;     /* hover / well */
    --hairline:rgba(216,196,176,0.12);
    --hairline-strong:rgba(216,196,176,0.24);
    --text:#F7F0E8;          /* warm off-white */
    --muted:#D8C4B0;         /* warm tan */
    --dim:#9C8B79;           /* dimmer tan for meta */
    --accent:#58A6FF;
    --accent-hover:#7FBBFF;
    --accent-soft:rgba(88,166,255,0.14);
    --accent-line:rgba(88,166,255,0.36);
    --success:#7EE787;
    --radius:16px;
    --radius-sm:12px;
    --shadow:0 1px 2px rgba(0,0,0,0.30), 0 18px 50px rgba(0,0,0,0.42);
    --font-display:"Sora", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    color:var(--text);
    background:var(--bg);
    font-family:var(--font-mono);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow-x:hidden;
  }

  /* Ambient signal-field canvas + layered warm/blue glow behind everything. */
  #field{position:fixed; inset:0; width:100%; height:100%; z-index:0; display:block;}
  .veil{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background:
      radial-gradient(1200px 760px at 50% 26%, rgba(88,166,255,0.10), transparent 60%),
      radial-gradient(900px 620px at 82% 8%, rgba(255,150,120,0.05), transparent 55%),
      radial-gradient(1200px 900px at 50% 118%, var(--bg-2), transparent 60%);
  }
  /* Fine grain so flat areas read as a warm surface, not a void. */
  .grain{
    position:fixed; inset:0; z-index:1; pointer-events:none; opacity:0.035;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .stage{
    position:relative; z-index:2;
    min-height:100%;
    display:flex; flex-direction:column;
    padding:26px clamp(18px,5vw,44px) 22px;
  }

  /* ── Masthead ─────────────────────────────────────────────────────────── */
  .top{display:flex; align-items:center; justify-content:space-between; gap:16px;}
  .brandmark{display:flex; align-items:center; gap:11px; min-width:0;}
  .brandmark svg{width:30px; height:30px; flex:0 0 auto;}
  .brandmark .wm{font-family:var(--font-display); font-weight:700; font-size:15px; letter-spacing:-0.01em; color:var(--text);}
  .brandmark .wm .tm{font-size:0.62em; vertical-align:super; color:var(--muted); font-weight:500;}
  .top .where{font-size:11px; letter-spacing:0.14em; color:var(--dim); text-transform:uppercase;}
  @media (max-width:560px){ .top .where{display:none;} }

  /* ── Hero ─────────────────────────────────────────────────────────────── */
  .hero{
    flex:1 1 auto;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding:min(9vh,72px) 0 min(6vh,44px);
  }
  .eyebrow{
    display:inline-flex; align-items:center; gap:9px;
    font-size:11px; letter-spacing:0.34em; text-transform:uppercase; color:var(--muted);
    padding:7px 14px; border:1px solid var(--hairline);
    border-radius:999px; background:rgba(38,32,25,0.5);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  }
  .eyebrow .live{
    width:6px; height:6px; border-radius:50%; background:var(--success);
    box-shadow:0 0 0 0 rgba(126,231,135,0.55); animation:pulse 2.6s ease-out infinite;
  }
  @keyframes pulse{ to{ box-shadow:0 0 0 7px rgba(126,231,135,0); } }

  .wordmark{
    font-family:var(--font-display); font-weight:700; color:var(--text);
    font-size:clamp(38px,8.4vw,92px); line-height:0.94; letter-spacing:-0.03em;
    text-align:center; text-wrap:balance; margin:26px 0 0;
  }
  .wordmark .os{
    background:linear-gradient(180deg,var(--accent-hover),var(--accent));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .wordmark .tm{font-family:var(--font-mono); font-size:0.24em; vertical-align:super; color:var(--muted); font-weight:500; letter-spacing:0;}

  .tagline{
    margin:24px 0 0; font-family:var(--font-display); font-weight:500;
    font-size:clamp(17px,2.4vw,24px); letter-spacing:-0.01em; color:var(--text);
    max-width:22ch; text-wrap:balance;
  }

  /* ── Doors ────────────────────────────────────────────────────────────── */
  .doors-label{
    margin:min(6vh,44px) 0 16px; font-size:11px; letter-spacing:0.28em;
    text-transform:uppercase; color:var(--dim);
    display:flex; align-items:center; gap:12px;
  }
  .doors-label::before,.doors-label::after{content:""; height:1px; width:clamp(28px,7vw,72px); background:var(--hairline);}

  .doors{
    width:100%; max-width:960px;
    display:grid; grid-template-columns:repeat(3,1fr); gap:18px;
    perspective:1200px;                 /* shared vanishing point for the tilt */
  }
  @media (max-width:720px){ .doors{grid-template-columns:1fr; max-width:420px; perspective:none;} }

  /* Each door is a threshold. --da / --da-hi are the per-door accent (r,g,b). */
  .door{
    --da:88,166,255; --da-hi:127,187,255;
    --mx:50%; --my:0%;                   /* cursor hotspot, set from JS */
    position:relative; isolation:isolate; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; text-align:center;
    gap:18px; padding:30px 22px 0; min-height:246px;
    text-decoration:none; color:inherit;
    border-radius:20px;
    border:1px solid var(--hairline);
    background:
      linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0) 24%),
      linear-gradient(180deg, rgba(52,44,35,0.62), rgba(28,23,18,0.78));
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,0.05), inset 0 -40px 60px rgba(0,0,0,0.28);
    transform-style:preserve-3d; will-change:transform;
    transition:transform .34s cubic-bezier(.2,.7,.2,1), border-color .34s, box-shadow .34s;
  }
  /* threshold light-line across the top of the frame */
  .door::before{
    content:""; position:absolute; left:14%; right:14%; top:0; height:1px; z-index:2;
    background:linear-gradient(90deg, transparent, rgba(var(--da-hi),0.7), transparent);
    opacity:.45; transition:opacity .34s;
  }
  /* the light behind the door — spills from where the cursor points, on hover */
  .door .halo{
    content:""; position:absolute; inset:-1px; z-index:0; border-radius:inherit; opacity:0;
    background:
      radial-gradient(260px 200px at var(--mx) var(--my), rgba(var(--da),0.34), transparent 62%),
      radial-gradient(150% 80% at 50% 118%, rgba(var(--da),0.12), transparent 60%);
    transition:opacity .4s;
  }
  .door > *{position:relative; z-index:1;}

  .plate{
    width:66px; height:66px; border-radius:18px; display:grid; place-items:center;
    color:rgb(var(--da-hi));
    background:radial-gradient(120% 120% at 50% 0%, rgba(var(--da),0.18), rgba(var(--da),0.05));
    border:1px solid rgba(var(--da),0.30);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.08), 0 10px 22px rgba(0,0,0,0.38);
    transition:transform .34s cubic-bezier(.2,.7,.2,1), box-shadow .34s, border-color .34s;
  }
  .plate svg{width:32px; height:32px; transition:transform .34s cubic-bezier(.2,.7,.2,1);}
  .door .name{
    font-family:var(--font-display); font-weight:600; font-size:22px;
    letter-spacing:0.08em; text-transform:uppercase; color:var(--text);
  }
  /* the sill: base of the doorway, holds the action */
  .sill{
    margin-top:auto; width:100%; padding:15px 0 17px;
    border-top:1px solid var(--hairline);
    display:flex; align-items:center; justify-content:center;
    transition:border-color .34s;
  }
  .enter{
    display:inline-flex; align-items:center; gap:9px;
    font-size:11px; letter-spacing:0.22em; text-transform:uppercase; font-weight:600;
    color:rgb(var(--da-hi));
  }
  .enter .arw{transition:transform .4s cubic-bezier(.34,1.56,.4,1);}  /* spring */

  .door:hover, .door:focus-visible{
    transform:translateY(-4px);         /* base lift; JS adds cursor tilt on fine pointers */
    border-color:rgba(var(--da),0.5);
    box-shadow:
      0 34px 74px rgba(0,0,0,0.58),
      0 0 0 1px rgba(var(--da),0.28),
      0 0 46px rgba(var(--da),0.14),
      inset 0 1px 0 rgba(255,255,255,0.09);
    outline:none;
  }
  .door:hover .halo, .door:focus-visible .halo{opacity:1;}
  .door:hover::before, .door:focus-visible::before{opacity:1;}
  .door:hover .plate, .door:focus-visible .plate{
    transform:translateY(-4px) scale(1.05);
    border-color:rgba(var(--da),0.6);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.12), 0 16px 32px rgba(0,0,0,0.42), 0 0 30px rgba(var(--da),0.28);
  }
  .door:hover .plate svg, .door:focus-visible .plate svg{transform:translateY(-1px) scale(1.08);}
  .door:hover .sill, .door:focus-visible .sill{border-color:rgba(var(--da),0.3);}
  .door:hover .enter .arw, .door:focus-visible .enter .arw{transform:translateX(7px);}
  .door:focus-visible{outline:2px solid rgb(var(--da)); outline-offset:4px;}

  /* Per-door accent — subtle, same family: Admin blue, VA warm teal, Client tan. */
  .door.va{--da:79,209,199; --da-hi:126,229,219;}
  .door.client{--da:150,133,116; --da-hi:184,167,147;}

  /* ── Footer ───────────────────────────────────────────────────────────── */
  .foot{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding-top:22px; margin-top:min(6vh,40px);
    border-top:1px solid var(--hairline);
    font-size:11px; letter-spacing:0.08em; color:var(--dim);
  }
  .foot a{color:var(--dim); text-decoration:none;}
  .foot a:hover{color:var(--muted);}
  @media (max-width:560px){ .foot{flex-direction:column; gap:8px; text-align:center;} }

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important; transition:none !important;}
  }
</style>
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>
  <div class="veil" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <main class="stage">
    <header class="top">
      <div class="brandmark">
        <!-- Bullseye mark: signal → read -->
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <circle cx="16" cy="16" r="14" stroke="#58A6FF" stroke-opacity="0.35" stroke-width="1.4"/>
          <circle cx="16" cy="16" r="9"  stroke="#58A6FF" stroke-opacity="0.6" stroke-width="1.4"/>
          <circle cx="16" cy="16" r="4"  stroke="#7FBBFF" stroke-width="1.6"/>
          <circle cx="16" cy="16" r="1.6" fill="#7FBBFF"/>
          <path d="M16 1.5V6M16 26v4.5M1.5 16H6M26 16h4.5" stroke="#58A6FF" stroke-opacity="0.5" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        <span class="wm">Remote Insight OS<span class="tm">™</span></span>
      </div>
      <span class="where">remoteinsightos.com</span>
    </header>

    <section class="hero">
      <span class="eyebrow"><span class="live" aria-hidden="true"></span>Secure entrance</span>

      <h1 class="wordmark">Remote<br/>Insight <span class="os">OS</span><span class="tm">™</span></h1>

      <p class="tagline">The operating system for remote teams.</p>

      <div class="doors-label">Choose your entrance</div>

      <nav class="doors" aria-label="Entrances">
        <a class="door admin" href="https://app.remoteinsightos.com">
          <span class="halo" aria-hidden="true"></span>
          <span class="plate">
            <svg viewBox="0 0 34 34" fill="none" aria-hidden="true">
              <rect x="3" y="5" width="28" height="20" rx="3" stroke="currentColor" stroke-width="1.7"/>
              <path d="M3 11h28" stroke="currentColor" stroke-width="1.7"/>
              <circle cx="6.5" cy="8" r="1" fill="currentColor"/><circle cx="9.5" cy="8" r="1" fill="currentColor"/>
              <path d="M8 17h7M8 20.5h11M22 16l4 3-4 3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M12 29h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="name">Admin</span>
          <span class="sill"><span class="enter">Enter <span class="arw">→</span></span></span>
        </a>

        <a class="door va" href="https://va.remoteinsightos.com">
          <span class="halo" aria-hidden="true"></span>
          <span class="plate">
            <svg viewBox="0 0 34 34" fill="none" aria-hidden="true">
              <circle cx="17" cy="11" r="5.4" stroke="currentColor" stroke-width="1.7"/>
              <path d="M6.5 29c1.4-5.6 5.6-8.5 10.5-8.5S26.1 23.4 27.5 29" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              <path d="M2.5 17h4l1.6-3.4L10 20l1.8-4 1.2 2h2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="name">VA</span>
          <span class="sill"><span class="enter">Enter <span class="arw">→</span></span></span>
        </a>

        <a class="door client" href="https://client.remoteinsightos.com">
          <span class="halo" aria-hidden="true"></span>
          <span class="plate">
            <svg viewBox="0 0 34 34" fill="none" aria-hidden="true">
              <rect x="4" y="6" width="26" height="22" rx="3" stroke="currentColor" stroke-width="1.7"/>
              <path d="M4 12h26" stroke="currentColor" stroke-width="1.7"/>
              <path d="M10 20c1.6-2.6 4-3.9 7-3.9s5.4 1.3 7 3.9c-1.6 2.6-4 3.9-7 3.9s-5.4-1.3-7-3.9Z" stroke="currentColor" stroke-width="1.6"/>
              <circle cx="17" cy="20" r="1.7" fill="currentColor"/>
            </svg>
          </span>
          <span class="name">Client</span>
          <span class="sill"><span class="enter">Enter <span class="arw">→</span></span></span>
        </a>
      </nav>
    </section>

    <footer class="foot">
      <span>Remote Insight OS<span style="color:var(--muted)">™</span> · Tele-Help-Ing</span>
      <span>Secure entry · <a href="https://remoteinsightos.com">remoteinsightos.com</a></span>
    </footer>
  </main>

  <script>
  /* Ambient "signal field": a bullseye radar with a slow sweep and signal
     points drifting inward — signals resolving into a read. Purely decorative,
     capped DPR, paused when the tab is hidden, and fully static under
     prefers-reduced-motion. */
  (function(){
    var canvas = document.getElementById("field");
    if(!canvas) return;
    var ctx = canvas.getContext("2d");
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var W=0, H=0, cx=0, cy=0, R=0, dpr=1;
    var pts=[], rings=[0.16,0.32,0.5,0.72,1.0];
    var ACCENT = "88,166,255";
    // Radar reacts to the hovered door: eased bloom + hue toward that accent.
    var hoverBoost=0, hoverTarget=0, hoverRGB="88,166,255";
    window.riosRadarHover = function(rgb){ hoverTarget = rgb ? 1 : 0; if(rgb) hoverRGB = rgb; };

    function size(){
      dpr = Math.min(window.devicePixelRatio||1, 2);
      W = canvas.clientWidth = window.innerWidth;
      H = canvas.clientHeight = window.innerHeight;
      canvas.width = Math.floor(W*dpr); canvas.height = Math.floor(H*dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0);
      cx = W*0.5; cy = H*0.30; R = Math.min(W,H)*0.62;  // center sits ABOVE the wordmark
    }
    function seed(){
      pts = [];
      var n = Math.round(Math.min(46, Math.max(18, W/34)));
      for(var i=0;i<n;i++){
        var a = Math.random()*Math.PI*2;
        var r = (0.26 + Math.random()*0.78);   // start outside the clean inner void
        pts.push({ a:a, r:r, sp:0.00006+Math.random()*0.00014, tw:Math.random()*Math.PI*2, dr:0.02+Math.random()*0.05 });
      }
    }
    function grid(){
      // concentric bullseye rings
      for(var i=0;i<rings.length;i++){
        var rr = rings[i]*R;
        ctx.beginPath(); ctx.arc(cx,cy,rr,0,Math.PI*2);
        ctx.strokeStyle = "rgba("+ACCENT+","+(0.05 + (rings.length-i)*0.012)+")";
        ctx.lineWidth = 1; ctx.stroke();
      }
      // faint crosshair
      ctx.strokeStyle="rgba("+ACCENT+",0.05)"; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(cx-R,cy); ctx.lineTo(cx+R,cy);
      ctx.moveTo(cx,cy-R); ctx.lineTo(cx,cy+R); ctx.stroke();
    }
    function point(p, glow){
      var x = cx + Math.cos(p.a)*p.r*R;
      var y = cy + Math.sin(p.a)*p.r*R;
      var tw = 0.45 + 0.55*Math.abs(Math.sin(p.tw));
      ctx.beginPath(); ctx.arc(x,y,1.5,0,Math.PI*2);
      ctx.fillStyle = "rgba("+ACCENT+","+(0.35*tw)+")"; ctx.fill();
      if(glow){
        ctx.beginPath(); ctx.arc(x,y,3.4,0,Math.PI*2);
        ctx.fillStyle = "rgba("+ACCENT+","+(0.10*tw)+")"; ctx.fill();
      }
    }
    var sweep = -Math.PI/2;
    function frame(){
      ctx.clearRect(0,0,W,H);
      grid();
      // ease the hover reaction; bloom a soft glow + tint the sweep toward the door
      hoverBoost += (hoverTarget - hoverBoost) * 0.07;
      var sweepRGB = hoverBoost > 0.02 ? hoverRGB : ACCENT;
      if(hoverBoost > 0.01){
        var hg = ctx.createRadialGradient(cx,cy,0,cx,cy,R*0.92);
        hg.addColorStop(0,"rgba("+hoverRGB+","+(0.12*hoverBoost)+")");
        hg.addColorStop(1,"rgba("+hoverRGB+",0)");
        ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(cx,cy,R*0.92,0,Math.PI*2); ctx.fill();
      }
      // radar sweep — a soft accent wedge, brighter while a door is hovered
      ctx.save();
      ctx.translate(cx,cy); ctx.rotate(sweep);
      var grd = ctx.createLinearGradient(0,0,R,0);
      grd.addColorStop(0,"rgba("+sweepRGB+","+(0.16 + 0.14*hoverBoost)+")");
      grd.addColorStop(1,"rgba("+sweepRGB+",0)");
      ctx.beginPath(); ctx.moveTo(0,0);
      ctx.arc(0,0,R,-0.28,0.02); ctx.closePath();
      ctx.fillStyle = grd; ctx.fill();
      ctx.restore();
      for(var i=0;i<pts.length;i++){
        var p=pts[i];
        p.a += p.sp*16;              // slow orbit
        p.r -= p.dr*0.0015;          // drift inward
        p.tw += 0.03;
        if(p.r < 0.22){ p.r = 1.02; p.a = Math.random()*Math.PI*2; } // recycle before the clean center
        // glow the point the sweep is passing over
        var da = Math.atan2(Math.sin(p.a-sweep),Math.cos(p.a-sweep));
        point(p, da>-0.28 && da<0.04);
      }
      sweep += 0.0042;
      raf = requestAnimationFrame(frame);
    }
    function still(){ ctx.clearRect(0,0,W,H); grid(); for(var i=0;i<pts.length;i++) point(pts[i],false); }

    var raf=null;
    function start(){ if(reduce){ still(); return; } cancelAnimationFrame(raf); raf=requestAnimationFrame(frame); }
    function stop(){ cancelAnimationFrame(raf); }

    size(); seed(); start();
    window.addEventListener("resize", function(){ size(); seed(); if(reduce) still(); }, {passive:true});
    document.addEventListener("visibilitychange", function(){ if(document.hidden) stop(); else start(); });
  })();

  /* Doors: a live threshold. On a fine pointer the card tilts toward the cursor
     and light spills from the point you aim at; the radar blooms toward the
     hovered door's accent. */
  (function(){
    var fine = window.matchMedia && window.matchMedia("(hover:hover) and (pointer:fine)").matches;
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var doors = document.querySelectorAll(".door");
    Array.prototype.forEach.call(doors, function(d){
      var da = (getComputedStyle(d).getPropertyValue("--da") || "88,166,255").trim();
      d.addEventListener("mouseenter", function(){ if(window.riosRadarHover) window.riosRadarHover(da); });
      d.addEventListener("mouseleave", function(){
        if(window.riosRadarHover) window.riosRadarHover(null);
        d.style.removeProperty("transform");
        d.style.setProperty("--mx","50%"); d.style.setProperty("--my","0%");
      });
      if(!fine || reduce) return;
      d.addEventListener("mousemove", function(e){
        var r = d.getBoundingClientRect();
        var px = (e.clientX - r.left)/r.width, py = (e.clientY - r.top)/r.height;
        d.style.setProperty("--mx", (px*100).toFixed(1)+"%");
        d.style.setProperty("--my", (py*100).toFixed(1)+"%");
        var rx = (0.5 - py) * 9, ry = (px - 0.5) * 11;
        d.style.transform = "translateY(-6px) rotateX("+rx.toFixed(2)+"deg) rotateY("+ry.toFixed(2)+"deg)";
      });
    });
